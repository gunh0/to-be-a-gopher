name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # latest 1.25 patch release, so security fixes such as CVE-2025-47910 are tested
          go-version: '1.25.x'
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: staticcheck
        run: make lint
      - name: test (race)
        run: make race
      - name: test (FIPS 140-3 mode)
        run: GODEBUG=fips140=on go test ./...
      - name: fuzz (smoke)
        run: make fuzz FUZZTIME=30s
